<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biodata - Angga Asril Akbar</title>
  <style>
    :root {
      --biru: #2563eb;
      --biru-muda: #eff6ff;
      --biru-tua: #1e3a8a;
      --abu: #64748b;
      --garis: #e2e8f0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--biru-muda);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #0f172a;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(37, 99, 235, 0.12);
      max-width: 400px;
      width: 100%;
      overflow: hidden;
      border: 1px solid var(--garis);
      animation: fadeUp 0.7s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .header {
      text-align: center;
      padding: 44px 24px 28px;
    }

    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      margin: 0 auto 18px;
      object-fit: cover;
      border: 4px solid #fff;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.25);
      background: var(--biru-muda);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 54px;
      color: var(--biru);
    }

    .header h1 {
      font-size: 23px;
      font-weight: 700;
      color: var(--biru-tua);
      margin-bottom: 6px;
    }

    .badge {
      display: inline-block;
      background: var(--biru);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 5px 16px;
      border-radius: 20px;
      letter-spacing: 0.3px;
    }

    .info {
      padding: 8px 28px 32px;
    }

    .info-item {
      display: flex;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid var(--garis);
    }

    .info-item:last-child {
      border-bottom: none;
    }

    .icon {
      font-size: 18px;
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--biru-muda);
      border-radius: 12px;
    }

    .label-value {
      margin-left: 14px;
    }

    .label {
      font-size: 11px;
      color: var(--abu);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    .value {
      font-size: 16px;
      color: #0f172a;
      font-weight: 600;
    }

    .footer {
      text-align: center;
      padding: 18px;
      background: var(--biru-muda);
      color: var(--abu);
      font-size: 12px;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <!-- Foto profil: ganti src ke "foto.jpg" setelah foto diunggah -->
      <div class="avatar">👤</div>
      <h1>Angga Asril Akbar</h1>
      <span class="badge">Pelukis Profesional</span>
    </div>

    <div class="info">
      <div class="info-item">
        <div class="icon">🎂</div>
        <div class="label-value">
          <div class="label">Umur</div>
          <div class="value">78 Tahun</div>
        </div>
      </div>

      <div class="info-item">
        <div class="icon">🖌️</div>
        <div class="label-value">
          <div class="label">Profesi</div>
          <div class="value">Pelukis</div>
        </div>
      </div>

      <div class="info-item">
        <div class="icon">💰</div>
        <div class="label-value">
          <div class="label">Penghasilan Bulanan</div>
          <div class="value">$1.000.000</div>
        </div>
      </div>

      <div class="info-item">
        <div class="icon">💍</div>
        <div class="label-value">
          <div class="label">Status</div>
          <div class="value">Single</div>
        </div>
      </div>

      <div class="info-item">
        <div class="icon">📍</div>
        <div class="label-value">
          <div class="label">Domisili</div>
          <div class="value">Jamaika</div>
        </div>
      </div>
    </div>

    <div class="footer">
      Kartu Biodata &middot; 2026
    </div>
  </div>
</body>
</html>
