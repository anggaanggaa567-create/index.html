<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biodata - Angga Asril Akbar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      max-width: 420px;
      width: 100%;
      overflow: hidden;
      animation: fadeUp 0.8s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .header {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      text-align: center;
      padding: 40px 20px 30px;
      color: #fff;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #fff;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 15px;
      opacity: 0.9;
    }

    .info {
      padding: 25px 30px 35px;
    }

    .info-item {
      display: flex;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .info-item:last-child {
      border-bottom: none;
    }

    .icon {
      font-size: 22px;
      width: 45px;
      text-align: center;
    }

    .label-value {
      margin-left: 10px;
    }

    .label {
      font-size: 12px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .value {
      font-size: 16px;
      color: #333;
      font-weight: 600;
    }

    .footer {
      text-align: center;
      padding: 15px;
      background: #fafafa;
      color: #aaa;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="avatar">🎨</div>
      <h1>Angga Asril Akbar</h1>
      <p>Pelukis Profesional</p>
    </div>

    <div class="info">
      <div class="info-item">
        <div class="icon">🎂</div>
        <div class="label-value">
          <div class="label">Umur</div>
          <div class="value">78 Tahun</div>
        </div>
      </div>

      <div class="info-item">
        <div class="icon">🖌️</div>
        <div class="label-value">
          <div class="label">Profesi</div>
          <div class="value">Pelukis</div>
        </div>
      </div>

      <div class="info-item">
        <div class="icon">💰</div>
        <div class="label-value">
          <div class="label">Penghasilan Bulanan</div>
          <div class="value">$1.000.000</div>
        </div>
      </div>

      <div class="info-item">
        <div class="icon">💍</div>
        <div class="label-value">
          <div class="label">Status</div>
          <div class="value">Single</div>
        </div>
      </div>

      <div class="info-item">
        <div class="icon">📍</div>
        <div class="label-value">
          <div class="label">Domisili</div>
          <div class="value">Jamaika</div>
        </div>
      </div>
    </div>

    <div class="footer">
      Kartu Biodata &copy; 2026
    </div>
  </div>
</body>
</html>
